AllCops:
  DisplayCopNames: true
  TargetRubyVersion: 3.3
  NewCops: enable

Metrics/MethodLength:
  Max: 150
Metrics/ClassLength:
  Max: 300
Metrics/AbcSize:
  Max: 200
Metrics/PerceivedComplexity:
  Max: 10

Layout/MultilineMethodCallIndentation:
  Enabled: false
Layout/IndentationWidth:
  Enabled: false
Layout/ElseAlignment:
  Enabled: false
Layout/EndAlignment:
  Enabled: false
