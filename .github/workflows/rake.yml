---
# yamllint disable rule:line-length
name: rake
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        ruby: ['3.2', '3.3']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install gnuplot (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y gnuplot
      - name: Install gnuplot (macOS)
        if: runner.os == 'macOS'
        run: brew install gnuplot
      - name: Configure git for tests
        run: |
          git config --global user.email "tdx@example.com"
          git config --global user.name "TDX Tester"
          git config --global init.defaultBranch master
      - run: bundle exec rake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
